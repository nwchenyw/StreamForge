name: Build and Release StreamForge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt
          pip install pyinstaller static-ffmpeg

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) {
            echo "$innoPath" >> $env:GITHUB_PATH
          }

      - name: Setup FFmpeg binaries
        run: |
          python -c "import shutil, os, static_ffmpeg; ffmpeg, ffprobe = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); os.makedirs('code/ffmpeg_bin', exist_ok=True); shutil.copy(ffmpeg, 'code/ffmpeg_bin/ffmpeg.exe'); shutil.copy(ffprobe, 'code/ffmpeg_bin/ffprobe.exe'); print('FFmpeg and FFprobe copied successfully')"

      - name: Build Application Directory with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --onedir --noconsole --name "StreamForge" --collect-all customtkinter --add-data "code/ffmpeg_bin;ffmpeg_bin" code/gui_app.py

      - name: Compile Inno Setup Windows Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" .github/installer/installer.iss

      - name: Package Portable ZIP Archive
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver -or $ver -eq "main") { $ver = "1.1.0" }
          Compress-Archive -Path "dist/StreamForge" -DestinationPath "installer/StreamForge-v${ver}-Portable.zip" -Force

      - name: Calculate SHA-256 Checksums
        shell: pwsh
        run: |
          $setupFile = Get-ChildItem -Path "installer" -Filter "StreamForge-Setup-*.exe" | Select-Object -First 1
          $zipFile = Get-ChildItem -Path "installer" -Filter "StreamForge-*-Portable.zip" | Select-Object -First 1
          $setupHash = (Get-FileHash -Path $setupFile.FullName -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash -Path $zipFile.FullName -Algorithm SHA256).Hash
          "$setupHash  $($setupFile.Name)`n$zipHash  $($zipFile.Name)" | Out-File -Encoding utf8 "installer/checksums-sha256.txt"
          Write-Host "Installer SHA-256: $setupHash ($($setupFile.Name))"
          Write-Host "Portable SHA-256:  $zipHash ($($zipFile.Name))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: StreamForge ${{ github.ref_name }}
          files: |
            installer/StreamForge-Setup-*.exe
            installer/StreamForge-*-Portable.zip
            installer/checksums-sha256.txt
          draft: false
          prerelease: false
          generate_release_notes: true
